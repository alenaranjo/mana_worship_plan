    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#090a10',
                        cardBg: '#131625',
                        cardBgHover: '#1a1e32',
                        cardBorder: '#232840',
                        accentPurple: '#8b5cf6',
                        accentViolet: '#7c3aed',
                        accentGlow: '#a78bfa',
                        accentPink: '#ec4899',
                        accentCyan: '#06b6d4',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090a10;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* Glassmorphism scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090a10;
        }
        ::-webkit-scrollbar-thumb {
            background: #232840;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }

        .glass-card {
            background: rgba(19, 22, 37, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .highlight-person {
            position: relative;
            background: rgba(139, 92, 246, 0.25) !important;
            border-color: rgba(167, 139, 250, 0.8) !important;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            transform: scale(1.02);
            transition: all 0.2s ease;
        }

        .highlight-card {
            border-color: rgba(139, 92, 246, 0.6) !important;
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.25);
        }

        .dim-card {
            opacity: 0.35;
            filter: grayscale(40%);
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .glass-card {
                background: white !important;
                color: black !important;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                break-inside: avoid;
            }
            .text-gray-400, .text-gray-300, .text-slate-400 {
                color: #333 !important;
            }
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- TOP HEADER -->
    <header class="no-print border-b border-cardBorder bg-[#090a10]/80 sticky top-0 z-40 backdrop-blur-md">

                <!-- Brand Title -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accentViolet via-purple-500 to-accentCyan flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-purple-900/40">

                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-purple-400">

                    <!-- Member Selector Filter -->

                        </div>
                        <select id="memberFilter" onchange="filterByMember()" class="w-full pl-9 pr-8 py-2 bg-cardBg border border-cardBorder text-sm rounded-xl focus:ring-2 focus:ring-accentPurple focus:border-transparent text-gray-200 cursor-pointer hover:bg-cardBgHover transition">

                    <!-- Clear Filter Button -->

                    <!-- Print Button -->

    </header>

            <div class="absolute top-0 right-0 -mt-4 -mr-4 w-32 h-32 bg-purple-600/10 rounded-full blur-2xl"></div>
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 relative z-10">
                <div class="flex items-start gap-4">
                    <div class="p-3 bg-purple-900/30 border border-purple-500/30 rounded-xl text-accentGlow">
                        <i class="fa-solid fa-compact-disc text-2xl animate-spin-slow"></i>
                    </div>
                    <div>
                        <span class="text-xs font-bold uppercase tracking-wider text-purple-400">Canción del Mes (CDM)</span>

                        <p class="text-xs text-gray-400 mt-0.5">Oasis Ministry</p>
                    </div>
                </div>

                    <div>

        <!-- Filter Status Banner (Shown when searching) -->
        <div id="filterBanner" class="hidden mb-6 p-4 rounded-xl bg-purple-900/30 border border-purple-500/40 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-user-tag text-purple-300 text-lg"></i>
                <div>
                    <p class="text-sm text-gray-200">Mostrando participaciones de: <strong id="filterMemberName" class="text-purple-300 text-base"></strong></p>

            }
        ];

        // State Management with LocalStorage Support
        let plans = loadStoredPlans();
        let currentFilterMember = "";

        function loadStoredPlans() {
            try {
                const stored = localStorage.getItem('mana_worship_plans_v1');
                if (stored) {
                    return JSON.parse(stored);
                }
            } catch (e) {
                console.error("Error loading from localStorage", e);
            }
            return [...initialPlansData];
        }

        function savePlansToStorage() {
            try {
                localStorage.setItem('mana_worship_plans_v1', JSON.stringify(plans));
            } catch (e) {
                console.error("Error saving to localStorage", e);
            }
        }

        // Normalize string for searching (ignores accents, case)
        function normalizeStr(str) {
            if (!str) return "";
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        // Get list of all unique members across all roles
        function getAllUniqueMembers() {
            const membersSet = new Set();

            plans.forEach(plan => {
                // Vocals
                plan.vocals.forEach(v => {
                    if (v.singer) {
                        v.singer.split(/ y | & |,/i).forEach(name => {
                            if(name.trim()) membersSet.add(name.trim());
                        });
                    }
                });

                // Coros
                plan.coros.forEach(c => {
                    if (c) c.split(/ y | & |,/i).forEach(name => {
                        if(name.trim()) membersSet.add(name.trim());
                    });
                });

                // Band
                Object.values(plan.band).forEach(b => {
                    if (b) {
                        b.split(/ y | & |,|EG1|EG2|\(Sáb\)|\(Dom\)/i).forEach(name => {
                            let clean = name.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ]/g, "").trim();
                            if(clean.length > 2) membersSet.add(clean);
                        });
                    }
                });

                // Tech
                if (plan.talkback) membersSet.add(plan.talkback.trim());
                if (plan.multitracks) membersSet.add(plan.multitracks.trim());
            });

            return Array.from(membersSet).sort();
        }

        // Render member dropdown options
        function populateMemberDropdown() {
            const select = document.getElementById('memberFilter');
            const members = getAllUniqueMembers();
            
            select.innerHTML = '<option value="">🔍 Filtrar por Miembro...</option>';
            
            members.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                select.appendChild(opt);
            });

            document.getElementById('totalMembersCount').textContent = `${members.length} Integrantes`;
        }

        // Check if member is present in a text string
        function isMemberInText(text, member) {
            if (!text || !member) return false;
            return normalizeStr(text).includes(normalizeStr(member));
        }

        // Main Render Function
        function renderPlans() {
            const container = document.getElementById('plansGrid');
            container.innerHTML = '';

            let matchedCardsCount = 0;
            let totalRolesForFilter = 0;

            plans.forEach((plan, planIdx) => {
                const isFiltering = currentFilterMember !== "";
                let hasMemberInPlan = false;

                if (isFiltering) {
                    const inVocals = plan.vocals.some(v => isMemberInText(v.singer, currentFilterMember));
                    const inCoros = plan.coros.some(c => isMemberInText(c, currentFilterMember));
                    const inBand = Object.values(plan.band).some(b => isMemberInText(b, currentFilterMember));
                    const inTech = isMemberInText(plan.talkback, currentFilterMember) || isMemberInText(plan.multitracks, currentFilterMember);

                    hasMemberInPlan = inVocals || inCoros || inBand || inTech;
                    if (hasMemberInPlan) matchedCardsCount++;
                }

                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-6 transition-all duration-300 flex flex-col justify-between border ${
                    isFiltering ? (hasMemberInPlan ? 'highlight-card' : 'dim-card') : 'hover:border-purple-500/40'
                }`;

                let vocalsHtml = plan.vocals.map(v => {
                    const isMatched = isFiltering && isMemberInText(v.singer, currentFilterMember);
                    if (isMatched) totalRolesForFilter++;

                    return `
                        <tr class="border-b border-cardBorder/40 last:border-none">
                            <td class="py-2 pr-3 font-semibold text-white ${isMatched ? 'highlight-person rounded px-2 text-purple-200' : ''}">
                                ${v.singer}
                            </td>
                            <td class="py-2 pl-2 text-gray-300 text-xs">
                                ${v.song}
                            </td>
                        </tr>
                    `;
                }).join('');

                const corosListHtml = plan.coros.map(c => {
                    const isMatched = isFiltering && isMemberInText(c, currentFilterMember);
                    if (isMatched) totalRolesForFilter++;
                    return `<span class="inline-block px-2.5 py-1 rounded-md bg-purple-950/50 border border-purple-800/40 text-xs ${
                        isMatched ? 'highlight-person text-purple-100 font-bold' : 'text-purple-200'
                    }">${c}</span>`;
                }).join(' ');

                const renderBandRow = (icon, label, value) => {
                    if (!value) return '';
                    const isMatched = isFiltering && isMemberInText(value, currentFilterMember);
                    if (isMatched) totalRolesForFilter++;
                    return `
                        <div class="flex items-center justify-between text-xs py-1 border-b border-cardBorder/30 last:border-none">
                            <span class="text-gray-400 flex items-center gap-2">
                                <span class="w-5 text-center">${icon}</span> ${label}:
                            </span>
                            <span class="font-medium ${isMatched ? 'highlight-person px-2 rounded text-white font-bold' : 'text-gray-200'}">
                                ${value}
                            </span>
                        </div>
                    `;
                };

                const isTbMatch = isFiltering && isMemberInText(plan.talkback, currentFilterMember);
                const isMtMatch = isFiltering && isMemberInText(plan.multitracks, currentFilterMember);
                if (isTbMatch) totalRolesForFilter++;
                if (isMtMatch) totalRolesForFilter++;

                card.innerHTML = `
                    <div>
                        <!-- Header Week title -->
                        <div class="flex items-center justify-between pb-4 border-b border-cardBorder mb-4">
                            <div>
                                <div class="text-xs font-bold text-accentPurple tracking-widest uppercase mb-1">
                                    ${plan.subtitle || 'SERVICIO'}
                                </div>
                                <h3 class="text-xl font-extrabold text-white tracking-tight flex items-center gap-2">
                                    ${plan.title}
                                </h3>
                            </div>
                        </div>

                        <!-- VOCALS TABLE (Matching Ref 2) -->
                                <button onclick="deletePlan(${planIdx})" class="p-2 text-gray-400 hover:text-red-400 transition rounded-lg hover:bg-cardBorder/50" title="Eliminar">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-5">
                            <div class="flex items-center justify-between text-xs uppercase font-bold text-gray-400 tracking-wider mb-2 border-b border-cardBorder pb-1">
                                <span>VOCAL</span>
                                <span>CANCIÓN</span>
                            </div>
                            <table class="w-full text-left border-collapse">
                                <tbody>
                                    ${vocalsHtml}
                                </tbody>
                            </table>
                        </div>

                        ${plan.coros.length > 0 ? `
                            <div class="mb-5 bg-[#0e111d] p-3 rounded-xl border border-cardBorder/50">
                                <span class="text-xs font-bold text-purple-400 tracking-wider uppercase block mb-1.5">COROS</span>
                                <div class="flex flex-wrap gap-1.5">
                                    ${corosListHtml}
                                </div>
                            </div>
                        ` : ''}

                        <div class="mb-5 bg-[#0e111d] p-3.5 rounded-xl border border-cardBorder/50">
                            <span class="text-xs font-bold text-cyan-400 tracking-wider uppercase block mb-2">BANDA</span>
                            <div class="space-y-0.5">
                                ${renderBandRow('🥁', 'Drums', plan.band.drums)}
                                ${renderBandRow('🎹', 'Piano', plan.band.piano)}
                                ${renderBandRow('🎸', 'Bajo (Bass)', plan.band.bass)}
                                ${renderBandRow('🎸', 'Acoustic Guitar', plan.band.ag)}
                                ${renderBandRow('🎸', 'Electric Guitar', plan.band.eg)}
                                ${renderBandRow('🎻', 'Violín', plan.band.violin)}
                            </div>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-cardBorder/60 space-y-2 text-xs">
                        <div class="grid grid-cols-2 gap-2 bg-slate-900/40 p-2.5 rounded-lg border border-cardBorder/30">
                            <div>
                                <span class="text-gray-400">TALK BACK:</span> 
                                <span class="font-semibold ${isTbMatch ? 'highlight-person px-1 rounded text-white' : 'text-gray-200'}">
                                    ${plan.talkback ? `${plan.talkback} ✓` : '—'}
                                </span>
                            </div>
                            <div>
                                <span class="text-gray-400">MULTITRACKS:</span> 
                                <span class="font-semibold ${isMtMatch ? 'highlight-person px-1 rounded text-white' : 'text-gray-200'}">
                                    ${plan.multitracks ? `${plan.multitracks} ✓` : '—'}
                                </span>
                            </div>
                        </div>

                        ${plan.ofrendas ? `
                            <div class="flex items-center gap-2 text-amber-300/90 pt-1">
                                <i class="fa-solid fa-hand-holding-dollar text-xs"></i>
                                <span><strong>OFRENDAS:</strong> ${plan.ofrendas}</span>
                            </div>
                        ` : ''}
                    </div>
                `;

                container.appendChild(card);
            });

            document.getElementById('totalServicesCount').textContent = `${plans.length} Servicios`;
            
            const filterBanner = document.getElementById('filterBanner');
            if (currentFilterMember !== "") {
                filterBanner.classList.remove('hidden');
                document.getElementById('filterMemberName').textContent = currentFilterMember;
                document.getElementById('filterStats').textContent = `Participa en ${matchedCardsCount} de ${plans.length} servicios con ${totalRolesForFilter} función(es) en total.`;
            } else {
                filterBanner.classList.add('hidden');
            }
        }

        // Filter Handlers
        function filterByMember() {
            const select = document.getElementById('memberFilter');
            currentFilterMember = select.value;
            const clearBtn = document.getElementById('clearBtn');
            
            if (currentFilterMember) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            renderPlans();
        }

        function clearFilter() {
            document.getElementById('memberFilter').value = "";
            currentFilterMember = "";
            document.getElementById('clearBtn').classList.add('hidden');
            renderPlans();
        }

        // App Initialization
        window.onload = function() {
            populateMemberDropdown();
            renderPlans();
        };
    </script>
</body>
</html>
